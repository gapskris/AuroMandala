name: PranaMandala CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-build:
    name: Typecheck, Unit Test & Build Production PWA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typechecking & linter
        run: npm run lint

      - name: Run deterministic domain & E2EE unit tests
        run: npx --yes tsx --test src/game/rules.test.ts src/utils/crypto.test.ts

      - name: Build production PWA bundle & Service Worker
        run: npm run build
